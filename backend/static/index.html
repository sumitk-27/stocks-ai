<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock AI — Stock Directory</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #0b1220;
      color: #e5edf9;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #111c30; border-bottom: 1px solid #28374f; }
    header > div, main { max-width: 1100px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 8px; }
    p { line-height: 1.6; }
    .muted { color: #a5b4cc; }
    .notice {
      padding: 14px 18px;
      border: 1px solid #725b25;
      background: #292310;
      border-radius: 10px;
    }
    .panel {
      margin-top: 24px;
      padding: 20px;
      background: #111c30;
      border: 1px solid #28374f;
      border-radius: 12px;
    }
    label { display: block; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #40516c;
      border-radius: 8px;
      background: #0b1220;
      color: inherit;
      font: inherit;
    }
    input:focus { outline: 2px solid #60a5fa; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #28374f;
    }
    th { color: #a5b4cc; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #error { color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Stock AI</h1>
      <div class="muted">NSE directory · Local development</div>
    </div>
  </header>

  <main>
    <p class="notice">
      Directory only. Live prices, AI predictions, portfolios, and trading
      alerts are not connected yet.
    </p>

    <section class="panel">
      <h2>Stock directory</h2>
      <p id="metadata" class="muted">Checking directory status…</p>

      <label for="search">Search company or symbol</label>
      <input
        id="search"
        type="search"
        placeholder="For example: INFY or Tata"
        maxlength="100"
        autocomplete="off"
      >

      <p id="status" role="status" aria-live="polite"></p>
      <p id="error" role="alert" hidden></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Symbol</th>
              <th scope="col">Company</th>
              <th scope="col">Exchange</th>
              <th scope="col">Series</th>
              <th scope="col">ISIN</th>
            </tr>
          </thead>
          <tbody id="stocks"></tbody>
        </table>
      </div>

      <div class="controls">
        <button id="previous" disabled>Previous</button>
        <span id="page-label">Page 1</span>
        <button id="next" disabled>Next</button>
      </div>
    </section>
  </main>

  <script>
    const search = document.querySelector("#search");
    const body = document.querySelector("#stocks");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    const pageLabel = document.querySelector("#page-label");

    let page = 1;
    const pageSize = 25;
    let timer;
    let requestId = 0;

    async function getJSON(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Request failed: HTTP ${response.status}`);
      }
      return response.json();
    }

    async function loadMetadata() {
      const metadata = document.querySelector("#metadata");

      try {
        const data = await getJSON("/directory");

        if (!data.import) {
          metadata.textContent =
            "No directory imported. Import your NSE CSV, then refresh.";
          return;
        }

        const imported = data.import;
        const date = new Date(imported.imported_at).toLocaleString();

        metadata.textContent =
          `${imported.row_count.toLocaleString()} imported listings · ` +
          `Imported locally: ${date} · File: ${imported.source_file}. ` +
          "Import time is not an exchange data timestamp.";
      } catch (err) {
        metadata.textContent = `Directory status unavailable: ${err.message}`;
      }
    }

    async function loadStocks() {
      const id = ++requestId;
      previous.disabled = true;
      next.disabled = true;
      error.hidden = true;
      status.textContent = "Loading…";
      body.replaceChildren();

      const params = new URLSearchParams({
        q: search.value.trim(),
        page: String(page),
        page_size: String(pageSize),
      });

      try {
        const data = await getJSON(`/stocks?${params}`);
        if (id !== requestId) return;

        for (const stock of data.items) {
          const row = document.createElement("tr");

          for (const field of [
            "symbol", "company_name", "exchange", "series", "isin"
          ]) {
            const cell = document.createElement("td");
            // Use textContent, not HTML, for imported data.
            cell.textContent = stock[field];
            row.appendChild(cell);
          }

          body.appendChild(row);
        }

        const pages = Math.max(1, Math.ceil(data.total / pageSize));
        pageLabel.textContent = `Page ${page} of ${pages}`;

        status.textContent = data.total === 0
          ? "No listings found. Check your search or import a directory."
          : `${data.total.toLocaleString()} matching listings`;

        previous.disabled = page <= 1;
        next.disabled = page >= pages;
      } catch (err) {
        if (id !== requestId) return;
        status.textContent = "Unable to load stocks.";
        error.textContent = `${err.message}. Check the backend and refresh.`;
        error.hidden = false;
      }
    }

    search.addEventListener("input", () => {
      clearTimeout(timer);
      // Invalidate any response belonging to the previous search.
      requestId++;
      previous.disabled = true;
      next.disabled = true;
      body.replaceChildren();
      status.textContent = "Waiting for search…";
      page = 1;
      timer = setTimeout(loadStocks, 300);
    });

    previous.addEventListener("click", () => {
      page--;
      loadStocks();
    });

    next.addEventListener("click", () => {
      page++;
      loadStocks();
    });

    loadMetadata();
    loadStocks();
  </script>
</body>
</html>
